# =============================================================
# app.conf — HTTP phase (before SSL is initialised)
#
# After running:  ./scripts/init-ssl.sh <domain> <email>
# this file is replaced with the full HTTP + HTTPS config.
# =============================================================

# ── Upstreams ─────────────────────────────────────────────────
upstream backend  { server backend:3000;  keepalive 32; }
upstream frontend { server frontend:80; }

# ── HTTP server ───────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Socket.io (WebSocket) ─────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;    # keep WS alive 24 h
        proxy_cache_bypass $http_upgrade;
    }

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api  burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Auth endpoints (tighter rate limit) ───────────────────
    location ~ ^/api/auth/(login|register) {
        limit_req  zone=auth  burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ── Frontend SPA ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass 1;
    }
}
