# ── Upstream ──────────────────────────────────────────────────────────────────
upstream api_backend {
    server api:8000;
    keepalive 16;
}

# ── Evolution API (WhatsApp) — interno, sem exposição direta ──────────────────
# O webhook da Evolution bate em /api/webhook/whatsapp/* (já passa pelo api_backend)
# O painel interno da Evolution fica em :8080 sem exposição pública intencional

# ── HTTP → HTTPS redirect + desafio Let's Encrypt ─────────────────────────────
server {
    listen 80;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # ── SSL ─────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/DOMINIO_AQUI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO_AQUI/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de segurança ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection "1; mode=block"      always;
    add_header Referrer-Policy "strict-origin"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API ─────────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Chat IA (rate limit mais restrito) ──────────────────────────────────────
    location /api/ai/ {
        limit_req zone=ai burst=5 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────────
    location /api/ws/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Frontend React (SPA) ────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;    # React Router — fallback para index.html
    }

    # Cache de assets estáticos (JS, CSS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Não cachear o index.html (sempre busca versão nova)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
