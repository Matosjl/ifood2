# ═══════════════════════════════════════════════════════════════════════════════
# iFood2 — Docker Compose (Development Full Stack)
# 5 serviços: Frontend | API FastAPI | MongoDB | Redis | Celery Worker
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  frontend:
    image: node:20-alpine
    container_name: ifood2_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "yarn install && yarn start"
    stdin_open: true
    tty: true
    depends_on:
      - api
    networks:
      - ifood2_net

  # ── 1. API FastAPI ──────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ifood2_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://db:27017
      - DB_NAME=ifood2
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OWNER_PASSWORD=${OWNER_PASSWORD:-troque_esta_senha_agora}
      - JWT_SECRET=${JWT_SECRET:-ajax-jwt-secret}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - ifood2_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── 2. MongoDB ──────────────────────────────────────────────────────────────
  db:
    image: mongo:7.0-jammy
    container_name: ifood2_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=ifood2
    networks:
      - ifood2_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── 3. Redis (Broker Celery + Cache) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ifood2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - ifood2_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── 4. Celery Worker (Processamento de IA) ──────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ifood2_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=1 --pool=prefork
    environment:
      - MONGO_URL=mongodb://db:27017
      - DB_NAME=ifood2
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_API_URL=${OLLAMA_API_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - ifood2_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ── Rede isolada ──────────────────────────────────────────────────────────────
networks:
  ifood2_net:
    driver: bridge

