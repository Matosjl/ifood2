# =============================================================
# SaaS Restaurant — Production Docker Compose
# =============================================================
# Usage:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d
#   3. ./scripts/init-ssl.sh app.yourdomain.com admin@yourdomain.com
# =============================================================

services:

  # ── Reverse Proxy ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: saas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── SSL auto-renewal ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: saas_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew every 12 h — Let's Encrypt only renews if expiry < 30 days
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet --webroot --webroot-path=/var/www/certbot;
          sleep 12h & wait $${!};
        done"
    restart: unless-stopped

  # ── API Server ───────────────────────────────────────────────
  backend:
    build:
      context: ./saas-backend
      dockerfile: Dockerfile
      target: production
    container_name: saas_backend
    env_file:
      - path: .env
        required: false   # file must exist in production; optional for CI/lint
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ── BullMQ Worker ────────────────────────────────────────────
  worker:
    build:
      context: ./saas-backend
      dockerfile: Dockerfile
      target: production
    container_name: saas_worker
    command: ["node", "src/workers/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Worker não expõe HTTP — verifica se o processo node está vivo
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x node > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ── Frontend (Vite build → Nginx static) ────────────────────
  frontend:
    build:
      context: ./saas-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL}"
    container_name: saas_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is auto-applied on first run (empty volume only)
      - ./saas-backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:
  uploads_data:

# ── Network ──────────────────────────────────────────────────
networks:
  default:
    name: saas_network
