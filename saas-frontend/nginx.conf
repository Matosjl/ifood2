# =============================================================
# Frontend SPA — Nginx config
# Handles: React Router fallback, asset caching, security headers
# =============================================================

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin"         always;
    add_header X-XSS-Protection       "1; mode=block"         always;

    # ── Vite build assets — cache forever (content hash in filename) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon / robots ─────────────────────────────────────
    location = /favicon.ico { expires 7d; access_log off; }
    location = /robots.txt  { expires 1d; access_log off; }

    # ── index.html — nunca cacheado (novo deploy = novo hash) ───
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── SPA fallback — send all unknown paths to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
