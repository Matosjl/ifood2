    # ── ZapFome Vigia MCP + Commander ─────────────────────────
    # Coloque este bloco DENTRO do server{} HTTPS em app.conf,
    # logo antes do bloco "location / { ... }"

    # MCP Server para Claude.ai (Bearer token protegido)
    location /mcp {
        proxy_pass         http://host.docker.internal:3002/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "";
        # SSE support
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Webhook WhatsApp (Evolution API chama aqui)
    location /vigia/webhook {
        proxy_pass       http://host.docker.internal:3002/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
